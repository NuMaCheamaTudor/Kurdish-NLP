[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "kurdish-nlp"
version = "0.1.0"
description = "Kurdish NLP utilities and language identification foundations"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
fasttext = ["fasttext>=0.9.2,<0.10"]
# fastText is pinned to 0.9.2: 0.9.3 trains on uninitialized memory when
# thread < 11 (see kurdish_nlp.langid.experiments.fasttext_baseline).
experiments = [
    "fasttext==0.9.2",
    "numpy>=2,<3",
    "scipy>=1.13",
    "scikit-learn>=1.9,<1.10",
    "joblib>=1.4",
    "threadpoolctl>=3",
    "matplotlib>=3.9",
]
wikimedia = ["mwparserfromhell>=0.7,<1"]
dev = ["pytest>=8,<10", "mwparserfromhell>=0.7,<1"]
ner = [
    "spacy==3.8.7",
    "spacy-transformers==1.3.9",
    "transformers==4.49.0",
    "torch==2.6.0",
    "numpy==2.2.6",
    "sentencepiece==0.2.0",
    "protobuf==5.29.4",
    "huggingface-hub==0.29.3",
    "safetensors==0.5.3",
    "tokenizers==0.21.1",
    "typer==0.15.2",
    "click==8.1.8",
    "weasel==0.4.1",
]

[project.scripts]
kurdish-langid-data = "kurdish_nlp.langid.cli:main"
kurdish-langid-experiment = "kurdish_nlp.langid.experiments.runner:main"
kurdish-ner = "kurdish_nlp.ner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
markers = [
    "experiment: trains tiny real fastText/scikit-learn models on synthetic data",
]
