[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "kurdish-nlp"
version = "0.1.0"
description = "Kurdish NLP utilities and language identification foundations"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
fasttext = ["fasttext>=0.9.2,<0.10"]
wikimedia = ["mwparserfromhell>=0.7,<1"]
dev = ["pytest>=8,<10", "mwparserfromhell>=0.7,<1"]

[project.scripts]
kurdish-langid-data = "kurdish_nlp.langid.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
